<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IP Quality Check</title>
    <meta name="description" content="Check any IP address for VPN, proxy, Tor, and hosting risk, and see where it is on a map." />
    <meta name="theme-color" content="#12140f" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <h1 class="brand">
        <img class="brand-mark" src="/logo.svg" alt="" width="48" height="48" />
        IP Quality Check
      </h1>
      <form id="lookup-form" class="lookup">
        <label for="lookup-ip">Enter an IP address</label>
        <div class="row">
          <input id="lookup-ip" name="ip" placeholder="e.g. 8.8.8.8" autocomplete="off" spellcheck="false" />
          <button type="submit">Check IP</button>
        </div>
      </form>
    </header>

    <div class="layout">
      <main class="stage">
        <div id="map" role="img" aria-label="Approximate IP location"></div>
        <p class="map-empty hidden" id="map-empty">No map location for this IP.</p>

        <aside class="card">
          <p class="ip" id="ip-display">—</p>
          <p class="place" id="place"></p>

          <div class="verdict" id="verdict">
            <p class="verdict-label" id="verdict-label">Checking…</p>
            <p class="verdict-score" id="verdict-score"></p>
          </div>

          <dl class="facts" id="facts"></dl>
        </aside>
      </main>

      <section class="signals-wrap">
        <h2>Why this result</h2>
        <ul id="signals" class="signals"></ul>
      </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
